name: firebase-fallback

# Temporary workflow (prototype): Data Connect at tools-version 6.1 with
# `traits: []` on its Firebase dependency.
#
# resolve: per Xcode, checks which Firebase major resolves and that Data
#   Connect still builds in the Swift 5 language mode.
#   - Xcode 16.4 / 26.0 / 26.1: Firebase 12.x.
#   - Xcode 26.2: Firebase 13.x.
#   (Xcode 16.4 = SwiftPM 6.1, the minimum for tools-version 6.1.)
#
# consumers: on Xcode 26.2, resolves small apps that depend on Data Connect and
#   compares Firestore package resolution against the baseline nc.xcode26
#   branch (no traits). Also checks Firebase 12 pinning and that an app using
#   Firestore still builds.

on:
  push:
    branches: [nc.xcode26.fallback, nc.xcode26.traits]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: resolve+build (Xcode ${{ matrix.xcode }}, expect ${{ matrix.expect }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "16.4"
            expect: "12"
          - xcode: "26.0"
            expect: "12"
          - xcode: "26.1"
            expect: "12"
          - xcode: "26.2"
            expect: "13"
    env:
      XCODE_VERSION: ${{ matrix.xcode }}
      EXPECT: ${{ matrix.expect }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Select Xcode
        shell: bash
        run: |
          ls -d /Applications/Xcode*.app
          # Match e.g. Xcode_26.0.app or Xcode_26.0.1.app.
          xcode_app=$(ls -d /Applications/Xcode_"${XCODE_VERSION}"*.app | sort -V | tail -1)
          echo "Selecting ${xcode_app}"
          sudo xcode-select -s "${xcode_app}/Contents/Developer"
          xcodebuild -version
          swift --version
          swift package --version

      - name: Resolve and assert
        shell: bash
        run: |
          # Make sure the version range is used, not firebase-ios-sdk main.
          unset FIREBASE_MAIN
          rm -rf .build Package.resolved

          swift package resolve

          version=$(jq -r '.pins[] | select(.identity == "firebase-ios-sdk") | .state.version' Package.resolved)
          echo "Resolved firebase-ios-sdk ${version}"
          echo "Pins:"
          jq -r '.pins[] | "  \(.identity) \(.state.version // .state.revision)"' Package.resolved
          if [[ "${version}" == "${EXPECT}".* ]]; then
            echo "OK: resolved Firebase ${EXPECT}.x."
          else
            echo "FAIL: expected Firebase ${EXPECT}.x."
            exit 1
          fi

      - name: Build FirebaseDataConnect
        shell: bash
        run: |
          unset FIREBASE_MAIN
          swift build --target FirebaseDataConnect

  consumers:
    name: consumers (Xcode 26.2)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Select Xcode
        shell: bash
        run: |
          xcode_app=$(ls -d /Applications/Xcode_26.2*.app | sort -V | tail -1)
          sudo xcode-select -s "${xcode_app}/Contents/Developer"
          swift --version

      - name: Check out baseline (nc.xcode26, no traits)
        shell: bash
        run: |
          # Directory name must match the package identity used by consumers.
          git worktree add "${RUNNER_TEMP}/base/data-connect-ios-sdk" origin/nc.xcode26
          head -1 "${RUNNER_TEMP}/base/data-connect-ios-sdk/Package.swift"

      - name: Create versioned prototype repo
        shell: bash
        run: |
          # Local clone with the real release tags plus a fake 11.99.0 tag on
          # the prototype commit, so SwiftPM can pick between them.
          repo="${RUNNER_TEMP}/repo/data-connect-ios-sdk"
          git clone --quiet "${GITHUB_WORKSPACE}" "${repo}"
          git -C "${repo}" tag 11.99.0 HEAD
          git -C "${repo}" tag --list '11.*' | sort -V | tail -3

      - name: Resolve consumers
        shell: bash
        run: |
          unset FIREBASE_MAIN
          bash .github/prototype/consumers.sh \
            "${GITHUB_WORKSPACE}" \
            "${RUNNER_TEMP}/base/data-connect-ios-sdk" \
            "file://${RUNNER_TEMP}/repo/data-connect-ios-sdk"
